openapi: 3.1.0
info:
  title: API
  version: 0.1.0
  description: The contract of this API. It is the source of truth for every consumer (spec §9.2).
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Is the server up
      responses:
        "200":
          description: The server is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
        "503":
          description: The server is up but its database does not answer.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [database unavailable]
