# The React flavor of the Midgard realm (change realm-leaf-naming): the realm of a React web leaf in the client
# gallery. It holds the recipe of that leaf (delta §9.4): the implementer prompt, the web template, the check
# ladder, the stacks and the acceptance check. The graph and the stage prompts are Voluspa's `software` graph.
# A project that also needs a Go API pins helheim-go for that leaf. The check ladder is rungs 1 to 5 of spec
# §9.5 in the task's loop, with the dependency policy (deps) beside the security rung; rung 6 is the three
# reviewers in the graph; the acceptance run is the pointer move's, and rung 7 is the grader's.
name: midgard-react
version: 0.1.0
checks:
  static: [/opt/ygg/checks/web-static.sh]
  unit: [/opt/ygg/checks/web-unit.sh]
  tdd: [/opt/ygg/checks/web-tdd.sh]
  contract: [/opt/ygg/checks/web-contract.sh]
  deps: [/opt/ygg/checks/web-deps.sh]
  security: [/opt/ygg/checks/web-security.sh]
  e2e: [/opt/ygg/checks/web-e2e.sh]
  accept: [/opt/ygg/checks/accept-e2e.sh]
leaf:
  description: A React web app that talks to its API through a typed contract
  template: templates/web
  first_commit: [LICENSE]
  implementer: prompts/implementer.md
  checks: [static, unit, tdd, contract, deps, security, e2e]
sandbox:
  build: devcontainer
  target: web
  egress: [registry.npmjs.org, api.osv.dev]
  acceptance:
    build: devcontainer
    target: acceptance
